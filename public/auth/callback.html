<!DOCTYPE html>
<html>
  <head>
    <title>Opening BrickFolio...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
      const APP_URL = "brickfolio:///login";

      // Replace later with real App Store URL
      const IOS_STORE_URL =
        "https://apps.apple.com/app/id0000000000";

      function isIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent);
      }

      function openApp() {
        window.location.href = APP_URL;

        if (isIOS()) {
          setTimeout(() => {
            window.location.href = IOS_STORE_URL;
          }, 2500);
        }
      }

      window.onload = () => {
        setTimeout(openApp, 500);
      };
    </script>
  </head>

  <body
    style="
      background:#4A0014;
      color:white;
      font-family:Arial;
      padding:24px;
      text-align:center;
    "
  >
    <h1>Opening BrickFolio...</h1>

    <p>If the app does not open automatically, tap below.</p>

    <button
      onclick="openApp()"
      style="
        background:#FF1F2D;
        color:white;
        border:0;
        border-radius:14px;
        padding:14px 20px;
        font-size:16px;
        font-weight:bold;
      "
    >
      Open BrickFolio
    </button>
  </body>
</html>
