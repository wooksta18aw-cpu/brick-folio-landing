<!DOCTYPE html>
<html>
  <head>
    <title>Opening BrickFolio...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script>
const ANDROID_INTENT =
  "intent://auth/callback#Intent;scheme=brickfolio;package=app.brickfolio.xnvbndfgvyrsp43izimwz;end";

const IOS_URL = "brickfolio://auth/callback";

      function isAndroid() {
        return /Android/i.test(navigator.userAgent);
      }

      function openApp() {
        if (isAndroid()) {
          window.location.href = ANDROID_INTENT;
        } else {
          window.location.href = IOS_URL;
        }
      }

      window.onload = () => {
        setTimeout(openApp, 500);
      };
    </script>
  </head>

  <body style="background:#4A0014;color:white;font-family:Arial;padding:24px;text-align:center;">
    <h1>Opening BrickFolio...</h1>
    <p>If the app does not open automatically, tap below.</p>

    <button
      onclick="openApp()"
      style="background:#FF1F2D;color:white;border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:bold;"
    >
      Open BrickFolio
    </button>
  </body>
</html>
